<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlackBox</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1b1e24; color: #d7dae0; font-size: 13px; height: 100vh; overflow: hidden; }
    .app { display: flex; height: 100vh; }

    .sidebar { width: 212px; flex: 0 0 212px; background: #15171c; border-right: 1px solid #2a2f38; display: flex; flex-direction: column; }
    .brand { padding: 16px 16px 12px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
    .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: #4c8bf5; box-shadow: 0 0 8px #4c8bf5; }
    .nav { padding: 6px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: #9aa2af; margin-bottom: 2px; }
    .nav-item:hover { background: #1e2229; color: #d7dae0; }
    .nav-item.active { background: #252b34; color: #fff; }
    .nav-item .ico { width: 18px; text-align: center; }
    .nav-item .badge { margin-left: auto; background: #2f3742; color: #aab2bf; border-radius: 10px; padding: 1px 7px; font-size: 11px; }
    .nav-item.active .badge { background: #4c8bf5; color: #fff; }
    .foot { margin-top: auto; padding: 10px 14px; font-size: 11px; color: #5c6672; border-top: 1px solid #2a2f38; font-family: ui-monospace, monospace; }
    .cap { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .capbtn { background: #252b34; border: 1px solid #313945; color: #cfd4dc; border-radius: 8px; padding: 7px; cursor: pointer; font-size: 13px; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
    .capbtn:hover { background: #2d353f; }
    .capbtn.dl { color: #7bd88f; }

    .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .toolbar { height: 44px; flex: 0 0 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid #2a2f38; background: #1e2229; }
    .tb-title { font-weight: 600; font-size: 14px; }
    .spacer { flex: 1; }
    .search { background: #12141a; border: 1px solid #2a2f38; color: #d7dae0; border-radius: 7px; padding: 5px 10px; width: 220px; font-size: 12px; outline: none; }
    .search:focus { border-color: #4c8bf5; }
    .tbtnx { background: #252b34; border: 1px solid #313945; color: #cfd4dc; border-radius: 7px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
    .tbtnx:hover { background: #2d353f; }
    .tbtnx.on { border-color: #7bd88f; color: #7bd88f; }
    .muted { color: #6b7482; font-size: 12px; }

    .view { flex: 1; min-height: 0; display: none; flex-direction: column; }
    .view.active { display: flex; }
    .split { flex: 1; min-height: 0; display: flex; }
    .list { flex: 1; overflow: auto; min-width: 0; }
    .detail { width: 44%; max-width: 640px; flex: 0 0 44%; overflow: auto; background: #181b21; }
    .content { flex: 1; overflow: auto; }

    table.grid { width: 100%; border-collapse: collapse; }
    table.grid th { position: sticky; top: 0; background: #1e2229; text-align: left; padding: 8px 12px; color: #8a919e; font-weight: 600; border-bottom: 1px solid #2a2f38; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; z-index: 1; }
    table.grid th.sortable { cursor: pointer; user-select: none; }
    table.grid th.sortable:hover { color: #d7dae0; }
    table.grid td { padding: 7px 12px; border-bottom: 1px solid #23272f; }
    table.net { table-layout: fixed; }
    table.net td { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    table.grid tr.r { cursor: pointer; }
    table.grid tr.r:hover { background: #20242c; }
    table.grid tr.r.sel { background: #26303f; }

    .badge-m { font-weight: 700; font-size: 11px; }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; }
    .url-cell { color: #c2c8d2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    select.level { background: #12141a; color: #d7dae0; border: 1px solid #2a2f38; border-radius: 7px; padding: 5px 8px; font-size: 12px; outline: none; }
    select.level:focus { border-color: #4c8bf5; }
    table.logs { table-layout: fixed; }
    table.logs td { padding: 4px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.45; vertical-align: top; }
    table.logs tr.lw td { background: rgba(255, 180, 84, 0.07); }
    table.logs tr.le td { background: rgba(255, 107, 107, 0.09); }
    table.logs td.time, table.logs td.pid { color: #6b7482; white-space: nowrap; }
    table.logs td.level { text-align: center; }
    table.logs td.msg { white-space: pre-wrap; word-break: break-word; color: #c2c8d2; }
    table.logs td.tag { color: #8a919e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    table.logs .lvbadge { display: inline-block; min-width: 16px; text-align: center; font-weight: 700; font-size: 11px; padding: 1px 6px; border-radius: 5px; }
    table.logs.compact td.time, table.logs.compact th.time,
    table.logs.compact td.pid, table.logs.compact th.pid,
    table.logs.compact td.tag, table.logs.compact th.tag { display: none; }

    .empty { padding: 40px; text-align: center; color: #5c6672; }
    .sec { border-bottom: 1px solid #23272f; }
    .sec-title { padding: 11px 14px 6px; color: #8a919e; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .secbtn { background: #252b34; border: 1px solid #313945; color: #cfd4dc; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 600; }
    .secbtn:hover { background: #2d353f; }
    .secbtn.ok { border-color: #7bd88f; color: #7bd88f; }
    table.kv { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.kv td { padding: 4px 14px; vertical-align: top; }
    table.kv td.k { color: #8a919e; white-space: nowrap; width: 1px; padding-right: 16px; font-family: ui-monospace, monospace; }
    table.kv td.v { color: #d0d5dd; word-break: break-all; font-family: ui-monospace, monospace; }
    pre.body { margin: 0; padding: 12px 14px; background: #12141a; white-space: pre-wrap; word-break: break-all; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #b9c2cc; }

    .pfile { padding: 14px 14px 6px; color: #7bd88f; font-weight: 700; font-family: ui-monospace, monospace; font-size: 13px; }
    input.pv { background: #12141a; border: 1px solid #2a2f38; color: #e6e6e6; border-radius: 5px; padding: 4px 7px; width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: 12px; }
    input.pv:focus { border-color: #4c8bf5; outline: none; }
    .rowbtn { background: #252b34; border: 1px solid #313945; color: #cfd4dc; border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 11px; }
    .rowbtn:hover { background: #2d353f; }

    .dbwrap { display: flex; flex: 1; min-height: 0; }
    .dbside { width: 240px; flex: 0 0 240px; overflow: auto; padding: 8px; }
    .dbmain { flex: 1; overflow: auto; }
    .dbgroup { margin-bottom: 12px; }
    .dbname { color: #8a919e; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; padding: 6px 8px; }
    .chip { display: block; margin: 3px 0; background: #1e2229; border: 1px solid #2a2f38; color: #cfd4dc; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; font-family: ui-monospace, monospace; }
    .chip:hover { background: #252b34; }
    .chip.sel { background: #26303f; border-color: #4c8bf5; color: #fff; }

    .resizer { flex: 0 0 7px; cursor: col-resize; position: relative; z-index: 2; }
    .resizer::before { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: #2a2f38; }
    .resizer:hover::before, .resizer.drag::before { background: #4c8bf5; width: 2px; }

    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb { background: #2f3742; border-radius: 6px; border: 3px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background: #3b4550; background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="brand"><span class="dot"></span> BlackBox</div>
      <div class="nav">
        <div class="nav-item active" id="nav-network" onclick="showView('network')"><span class="ico">🌐</span> Network <span class="badge" id="net-badge">0</span></div>
        <div class="nav-item" id="nav-prefs" onclick="showView('prefs')"><span class="ico">⚙️</span> Preferences</div>
        <div class="nav-item" id="nav-db" onclick="showView('db')"><span class="ico">🗄️</span> Databases</div>
        <div class="nav-item" id="nav-logs" onclick="showView('logs')"><span class="ico">📋</span> Logcat</div>
      </div>
      <div class="cap">
        <button class="capbtn" onclick="screenshot()">📷 Screenshot</button>
        <button class="capbtn" id="recbtn" onclick="toggleRecord()">⏺ Record</button>
      </div>
      <div class="foot" id="devinfo">debug · 127.0.0.1:8080</div>
    </div>

    <div class="main">
      <div class="view active" id="view-network">
        <div class="toolbar">
          <span class="tb-title">Network</span>
          <input class="search" id="net-filter" placeholder="Filter URL…" oninput="onFilter(this.value)">
          <button class="tbtnx" onclick="clearNetwork()">Clear</button>
          <span class="spacer"></span>
          <span class="muted" id="net-count"></span>
        </div>
        <div class="split">
          <div class="list">
            <table class="grid net">
              <thead><tr><th class="sortable" onclick="toggleSort()" style="width:104px">Time <span id="net-sort-ind">▼</span></th><th style="width:74px">Method</th><th style="width:60px">Status</th><th>URL</th><th style="width:78px">Duration</th></tr></thead>
              <tbody id="net-rows"></tbody>
            </table>
          </div>
          <div class="resizer" id="net-resizer"></div>
          <div class="detail" id="net-detail"><div class="empty">Select a request to inspect</div></div>
        </div>
      </div>

      <div class="view" id="view-prefs">
        <div class="toolbar">
          <span class="tb-title">Preferences</span>
          <button class="tbtnx" onclick="tickPrefs()">↻ Refresh</button>
          <span class="spacer"></span>
          <span class="muted" id="prefs-count"></span>
        </div>
        <div class="content" id="prefs-content"></div>
      </div>

      <div class="view" id="view-db">
        <div class="toolbar">
          <span class="tb-title">Databases</span>
          <button class="tbtnx" onclick="tickDb()">↻ Refresh</button>
          <button class="tbtnx" id="db-live" onclick="toggleDbLive()">◻ Live Updates</button>
          <span class="spacer"></span>
          <span class="muted" id="db-count"></span>
        </div>
        <div class="dbwrap">
          <div class="dbside" id="db-side"></div>
          <div class="resizer" id="db-resizer"></div>
          <div class="dbmain" id="db-main"><div class="empty">Select a table</div></div>
        </div>
      </div>

      <div class="view" id="view-logs">
        <div class="toolbar">
          <span class="tb-title">Logcat</span>
          <select class="level" id="log-level" onchange="onLogLevel(this.value)">
            <option value="V">Verbose</option>
            <option value="D">Debug</option>
            <option value="I">Info</option>
            <option value="W">Warn</option>
            <option value="E">Error</option>
          </select>
          <input class="search" id="log-filter" placeholder="Filter tag / message…" oninput="onLogFilter(this.value)">
          <button class="tbtnx" onclick="clearLogs()">Clear</button>
          <button class="tbtnx" id="log-pause" onclick="togglePause()">⏸ Pause</button>
          <button class="tbtnx" id="log-compact" onclick="toggleCompact()">Compact</button>
          <span class="spacer"></span>
          <span class="muted" id="log-count"></span>
        </div>
        <div class="list" id="log-list">
          <table class="grid logs">
            <thead><tr><th class="time" style="width:104px">Time</th><th class="pid" style="width:82px">PID-TID</th><th style="width:56px">Level</th><th class="tag" style="width:160px">Tag</th><th>Message</th></tr></thead>
            <tbody id="log-rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const MAX = 20000;
    let view = 'network';
    let netData = [];
    let selectedId = null;
    let filter = '';
    let lastSig = '';
    let lastDetailId = undefined;
    let sortDir = 'desc';

    function esc(s) { return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function escA(s) { return esc(s).replace(/"/g, '&quot;'); }
    function pretty(b) { if (!b) return ''; try { return JSON.stringify(JSON.parse(b), null, 2); } catch (e) { return b; } }
    function mcolor(m) { return ({ GET: '#7bd88f', POST: '#ffd166', PUT: '#4c8bf5', DELETE: '#ff6b6b', PATCH: '#c792ea' })[m] || '#8a919e'; }
    function scolor(c) { if (c >= 500) return '#ff6b6b'; if (c >= 400) return '#ffb454'; if (c >= 300) return '#56b6c2'; return '#7bd88f'; }
    function sec(title, body, actions) { return '<div class="sec"><div class="sec-title"><span>' + title + '</span>' + (actions || '') + '</div>' + body + '</div>'; }
    function fmtTime(ts) { if (!ts) return ''; const d = new Date(ts); const p = (n, l) => String(n).padStart(l || 2, '0'); return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + p(d.getMilliseconds(), 3); }
    function toggleSort() { sortDir = sortDir === 'desc' ? 'asc' : 'desc'; const ind = document.getElementById('net-sort-ind'); if (ind) { ind.textContent = sortDir === 'desc' ? '▼' : '▲'; } lastSig = ''; renderNetList(); }
    function selectedEntry() { return netData.find(x => x.id === selectedId); }
    function copyText(str, btn) {
      const done = () => { if (!btn) return; const label = btn.dataset.label || btn.textContent; btn.dataset.label = label; btn.textContent = 'Copied!'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = label; btn.classList.remove('ok'); }, 1200); };
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(str).then(done).catch(() => fallbackCopy(str, done)); }
      else { fallbackCopy(str, done); }
    }
    function fallbackCopy(str, done) {
      const ta = document.createElement('textarea'); ta.value = str; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); if (done) done(); } catch (e) {}
      ta.remove();
    }
    function copyReqBody(btn) { const e = selectedEntry(); if (e) copyText(e.requestBody || '', btn); }
    function copyResBody(btn) { const e = selectedEntry(); if (e) copyText(e.responseBody || '', btn); }
    function shq(s) { return "'" + String(s).replace(/'/g, "'\\''") + "'"; }
    function buildCurl(e) {
      let c = 'curl -X ' + e.method + ' ' + shq(e.url);
      const hs = e.requestHeaders || {};
      for (const k in hs) { c += " \\\n  -H " + shq(k + ': ' + hs[k]); }
      if (e.requestBody) { c += " \\\n  --data " + shq(e.requestBody); }
      return c;
    }
    function copyCurl(btn) { const e = selectedEntry(); if (e) copyText(buildCurl(e), btn); }

    function showView(v) {
      view = v;
      for (const x of ['network', 'prefs', 'db', 'logs']) {
        document.getElementById('view-' + x).classList.toggle('active', x === v);
        document.getElementById('nav-' + x).classList.toggle('active', x === v);
      }
      if (v === 'network') tickNetwork();
      else if (v === 'prefs') tickPrefs();
      else if (v === 'db') tickDb();
      else tickLogs();
    }

    function onFilter(val) { filter = val.toLowerCase(); lastSig = ''; renderNetList(); }
    async function clearNetwork() {
      try { await fetch('api/network/clear', { method: 'POST' }); } catch (e) {}
      selectedId = null; lastSig = ''; lastDetailId = undefined; tickNetwork();
    }

    async function tickNetwork() {
      let data;
      try { data = await (await fetch('api/network')).json(); } catch (e) { return; }
      netData = data;
      document.getElementById('net-badge').textContent = data.length;
      document.getElementById('net-count').textContent = data.length + ' requests';
      renderNetList();
      renderNetDetail();
    }

    function renderNetList() {
      const rows = (filter ? netData.filter(e => e.url.toLowerCase().includes(filter)) : netData.slice())
        .sort((a, b) => { const d = (a.timestamp || 0) - (b.timestamp || 0) || (a.id - b.id); return sortDir === 'asc' ? d : -d; });
      const sig = rows.map(e => e.id).join(',') + '|' + selectedId + '|' + sortDir;
      if (sig === lastSig) return;
      lastSig = sig;
      let h = '';
      for (const e of rows) {
        h += '<tr class="r' + (e.id === selectedId ? ' sel' : '') + '" onclick="selectRow(' + e.id + ')">'
          + '<td class="muted">' + fmtTime(e.timestamp) + '</td>'
          + '<td><span class="badge-m" style="color:' + mcolor(e.method) + '">' + e.method + '</span></td>'
          + '<td><span class="pill" style="color:' + scolor(e.code) + '">' + e.code + '</span></td>'
          + '<td class="url-cell">' + esc(e.url) + '</td>'
          + '<td class="muted">' + e.durationMs + ' ms</td>'
          + '</tr>';
      }
      document.getElementById('net-rows').innerHTML = h || '<tr><td colspan="5" class="empty">No requests</td></tr>';
    }

    function selectRow(id) { selectedId = id; lastSig = ''; renderNetList(); renderNetDetail(); }

    function headersTbl(obj) {
      const keys = Object.keys(obj || {});
      if (!keys.length) return '<div style="padding:6px 14px" class="muted">(none)</div>';
      let h = '<table class="kv">';
      for (const k of keys) h += '<tr><td class="k">' + esc(k) + '</td><td class="v">' + esc(obj[k]) + '</td></tr>';
      return h + '</table>';
    }

    function renderNetDetail() {
      if (selectedId === lastDetailId) return;
      lastDetailId = selectedId;
      const el = document.getElementById('net-detail');
      const e = netData.find(x => x.id === selectedId);
      if (!e) { el.innerHTML = '<div class="empty">Select a request to inspect</div>'; return; }
      let h = sec('General', '<table class="kv">'
        + '<tr><td class="k">URL</td><td class="v">' + esc(e.url) + '</td></tr>'
        + '<tr><td class="k">Method</td><td class="v" style="color:' + mcolor(e.method) + '">' + e.method + '</td></tr>'
        + '<tr><td class="k">Status</td><td class="v" style="color:' + scolor(e.code) + '">' + e.code + '</td></tr>'
        + '<tr><td class="k">Duration</td><td class="v">' + e.durationMs + ' ms</td></tr>'
        + '<tr><td class="k">Time</td><td class="v">' + fmtTime(e.timestamp) + '</td></tr>'
        + '</table>', '<button class="secbtn" onclick="copyCurl(this)">Copy as cURL</button>');
      h += sec('Request Headers', headersTbl(e.requestHeaders));
      if (e.requestBody) h += sec('Request Body', '<pre class="body">' + esc(pretty(e.requestBody).slice(0, MAX)) + '</pre>', '<button class="secbtn" onclick="copyReqBody(this)">Copy</button>');
      h += sec('Response Headers', headersTbl(e.responseHeaders));
      h += sec('Response Body', '<pre class="body">' + esc(pretty(e.responseBody).slice(0, MAX)) + '</pre>', '<button class="secbtn" onclick="copyResBody(this)">Copy</button>');
      el.innerHTML = h;
    }

    async function tickPrefs() {
      let data;
      try { data = await (await fetch('api/prefs')).json(); } catch (e) { return; }
      const total = data.reduce((n, f) => n + f.entries.length, 0);
      document.getElementById('prefs-count').textContent = data.length + ' files · ' + total + ' keys';
      let h = '';
      for (const f of data) {
        h += '<div class="pfile">' + esc(f.file) + '.xml</div>';
        h += '<table class="grid"><thead><tr><th style="width:26%">Key</th><th>Value</th><th style="width:90px">Type</th><th style="width:150px"></th></tr></thead><tbody>';
        for (const e of f.entries) {
          h += '<tr>'
            + '<td class="url-cell">' + esc(e.key) + '</td>'
            + '<td><input class="pv" data-file="' + escA(f.file) + '" data-key="' + escA(e.key) + '" data-type="' + escA(e.type) + '" value="' + escA(e.value) + '"></td>'
            + '<td class="muted">' + esc(e.type) + '</td>'
            + '<td style="white-space:nowrap"><button class="rowbtn" onclick="savePref(this)">save</button> <button class="rowbtn" onclick="delPref(this)">delete</button></td>'
            + '</tr>';
        }
        h += '</tbody></table>';
      }
      document.getElementById('prefs-content').innerHTML = h || '<div class="empty">No preferences</div>';
    }

    async function postJson(url, payload) { const r = await fetch(url, { method: 'POST', body: JSON.stringify(payload) }); return r.json(); }
    async function savePref(btn) { const i = btn.closest('tr').querySelector('input.pv'); const r = await postJson('api/prefs/edit', { file: i.dataset.file, key: i.dataset.key, type: i.dataset.type, value: i.value }); if (!r.ok) { alert('edit failed: ' + (r.error || '')); return; } tickPrefs(); }
    async function delPref(btn) { const i = btn.closest('tr').querySelector('input.pv'); if (!confirm('delete ' + i.dataset.key + '?')) return; const r = await postJson('api/prefs/delete', { file: i.dataset.file, key: i.dataset.key }); if (!r.ok) { alert('delete failed: ' + (r.error || '')); return; } tickPrefs(); }

    let dbSel = '';
    let dbLive = false;
    let dbCurrent = null;
    function toggleDbLive() {
      dbLive = !dbLive;
      const btn = document.getElementById('db-live');
      btn.textContent = dbLive ? '◉ Live Updates' : '◻ Live Updates';
      btn.classList.toggle('on', dbLive);
      if (dbLive && dbCurrent) loadTable(dbCurrent.db, dbCurrent.table);
    }
    async function tickDb() {
      let data;
      try { data = await (await fetch('api/db')).json(); } catch (e) { return; }
      document.getElementById('db-count').textContent = data.length + ' databases';
      let h = '';
      for (const d of data) {
        h += '<div class="dbgroup"><div class="dbname">' + esc(d.db) + '</div>';
        if (!d.tables.length) h += '<div class="muted" style="padding:4px 8px">(no tables)</div>';
        for (const t of d.tables) {
          const id = d.db + '|' + t;
          h += '<div class="chip' + (id === dbSel ? ' sel' : '') + '" data-db="' + escA(d.db) + '" data-table="' + escA(t) + '" onclick="pickTable(this)">' + esc(t) + '</div>';
        }
        h += '</div>';
      }
      document.getElementById('db-side').innerHTML = h || '<div class="empty">No databases</div>';
    }

    function pickTable(el) {
      dbSel = el.dataset.db + '|' + el.dataset.table;
      dbCurrent = { db: el.dataset.db, table: el.dataset.table };
      document.querySelectorAll('#db-side .chip').forEach(c => c.classList.toggle('sel', c === el));
      loadTable(el.dataset.db, el.dataset.table);
    }

    async function loadTable(db, table) {
      let data;
      try { data = await (await fetch('api/db/table?db=' + encodeURIComponent(db) + '&table=' + encodeURIComponent(table))).json(); } catch (e) { return; }
      const el = document.getElementById('db-main');
      if (data.error) { el.innerHTML = '<div class="empty" style="color:#ff6b6b">' + esc(data.error) + '</div>'; return; }
      let h = '<div class="pfile">' + esc(table) + ' · ' + data.count + ' rows</div><table class="grid"><thead><tr>';
      for (const c of data.columns) h += '<th>' + esc(c) + '</th>';
      h += '</tr></thead><tbody>';
      for (const row of data.rows) { h += '<tr>'; for (const cell of row) h += '<td class="url-cell">' + esc(cell) + '</td>'; h += '</tr>'; }
      h += '</tbody></table>';
      el.innerHTML = h;
    }

    let logsData = [];
    let logFilter = '';
    let logLevel = 'V';
    let logLastId = 0;
    let logPaused = false;
    let logCompact = false;
    let logSig = '';
    let logGen = 0;
    const LOG_MAX = 5000;
    const LEVEL_RANK = { V: 0, D: 1, I: 2, W: 3, E: 4, F: 5, A: 6 };
    function levelColor(l) { return ({ V: '#6b7482', D: '#4c8bf5', I: '#7bd88f', W: '#ffb454', E: '#ff6b6b', F: '#ff6b6b', A: '#ff6b6b' })[l] || '#8a919e'; }
    function levelRowClass(l) { return l === 'W' ? 'lw' : (l === 'E' || l === 'F' || l === 'A') ? 'le' : ''; }
    function msgColor(l) { return l === 'W' ? '#ffd18a' : (l === 'E' || l === 'F' || l === 'A') ? '#ff9a9a' : '#c2c8d2'; }
    function toggleCompact() {
      logCompact = !logCompact;
      document.getElementById('log-compact').classList.toggle('on', logCompact);
      document.querySelector('table.logs').classList.toggle('compact', logCompact);
    }
    function onLogFilter(val) { logFilter = val.toLowerCase(); logSig = ''; renderLogs(); }
    function onLogLevel(val) { logLevel = val; logSig = ''; renderLogs(); }
    function togglePause() {
      logPaused = !logPaused;
      const btn = document.getElementById('log-pause');
      btn.textContent = logPaused ? '▶ Resume' : '⏸ Pause';
      btn.classList.toggle('on', logPaused);
      if (!logPaused) { tickLogs(); }
    }
    async function clearLogs() {
      logGen++;
      try { await fetch('api/logs/clear', { method: 'POST' }); } catch (e) {}
      logsData = []; logLastId = 0; logSig = ''; renderLogs();
      document.getElementById('log-count').textContent = '0 lines';
    }
    async function tickLogs() {
      if (logPaused) return;
      const gen = logGen;
      let data;
      try { data = await (await fetch('api/logs?since=' + logLastId)).json(); } catch (e) { return; }
      if (gen !== logGen) return;
      if (data.length) {
        logsData = logsData.concat(data);
        if (logsData.length > LOG_MAX) logsData = logsData.slice(-LOG_MAX);
        logLastId = logsData[logsData.length - 1].id;
      }
      document.getElementById('log-count').textContent = logsData.length + ' lines';
      renderLogs();
    }
    function renderLogs() {
      const min = LEVEL_RANK[logLevel] || 0;
      const rows = logsData.filter(e => (LEVEL_RANK[e.level] || 0) >= min
        && (!logFilter || (e.tag + ' ' + e.message).toLowerCase().includes(logFilter)));
      const sig = (rows.length ? rows[rows.length - 1].id : 0) + ':' + rows.length + '|' + logLevel + '|' + logFilter;
      if (sig === logSig) return;
      logSig = sig;
      let h = '';
      for (const e of rows) {
        const c = levelColor(e.level);
        h += '<tr class="' + levelRowClass(e.level) + '">'
          + '<td class="time">' + esc(e.time) + '</td>'
          + '<td class="pid">' + e.pid + '-' + e.tid + '</td>'
          + '<td class="level"><span class="lvbadge" style="color:' + c + ';background:' + c + '22">' + esc(e.level) + '</span></td>'
          + '<td class="tag">' + esc(e.tag) + '</td>'
          + '<td class="msg" style="color:' + msgColor(e.level) + '">' + esc(e.message) + '</td>'
          + '</tr>';
      }
      document.getElementById('log-rows').innerHTML = h || '<tr><td colspan="5" class="empty">No logs</td></tr>';
      if (!logPaused) { const l = document.getElementById('log-list'); l.scrollTop = l.scrollHeight; }
    }

    async function loadDevice() {
      try {
        const d = await (await fetch('api/device')).json();
        document.getElementById('devinfo').textContent = '📱 ' + d.model + ' · Android ' + d.android + ' (API ' + d.sdk + ')';
      } catch (e) {}
    }

    async function screenshot() {
      try {
        const res = await fetch('api/screenshot');
        if (!res.ok) { alert('screenshot failed — bring the app to the foreground on the device'); return; }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'blackbox-' + Date.now() + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) { alert('screenshot error'); }
    }

    let recState = 'idle';
    function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    async function downloadRecording() {
      const res = await fetch('api/record/latest');
      if (!res.ok) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'blackbox-' + Date.now() + '.mp4';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function toggleRecord() {
      if (recState === 'recording') {
        document.getElementById('recbtn').textContent = '⏳ Saving…';
        await fetch('api/record/stop', { method: 'POST' });
        for (let i = 0; i < 20; i++) {
          const s = await (await fetch('api/record/status')).json();
          if (s.state !== 'recording' && s.hasRecording) {
            await downloadRecording();
            break;
          }
          await sleep(400);
        }
      } else {
        await fetch('api/record/start', { method: 'POST' });
        alert('기기 화면에서 "Entire screen"(전체 화면) → "Start recording"을 눌러 녹화를 허용하세요.');
      }
      recTick();
    }

    async function recTick() {
      try {
        const s = await (await fetch('api/record/status')).json();
        recState = s.state;
        document.getElementById('recbtn').textContent =
          s.state === 'recording' ? '⏹ Stop recording'
          : s.state === 'requesting' ? '⏳ Waiting for device…'
          : '⏺ Record';
      } catch (e) {}
    }

    function initResizer(resizerId, paneId, side, min) {
      const resizer = document.getElementById(resizerId);
      const pane = document.getElementById(paneId);
      if (!resizer || !pane) return;
      resizer.addEventListener('mousedown', (e) => {
        e.preventDefault();
        const startX = e.clientX;
        const startW = pane.getBoundingClientRect().width;
        const dir = side === 'right' ? -1 : 1;
        resizer.classList.add('drag');
        document.body.style.userSelect = 'none';
        document.body.style.cursor = 'col-resize';
        function move(ev) {
          let w = startW + dir * (ev.clientX - startX);
          w = Math.max(min, Math.min(w, window.innerWidth - 420));
          pane.style.flex = '0 0 ' + w + 'px';
          pane.style.maxWidth = 'none';
        }
        function up() {
          resizer.classList.remove('drag');
          document.body.style.userSelect = '';
          document.body.style.cursor = '';
          window.removeEventListener('mousemove', move);
          window.removeEventListener('mouseup', up);
        }
        window.addEventListener('mousemove', move);
        window.addEventListener('mouseup', up);
      });
    }
    initResizer('net-resizer', 'net-detail', 'right', 280);
    initResizer('db-resizer', 'db-side', 'left', 160);

    setInterval(() => { if (view === 'network') tickNetwork(); }, 1000);
    setInterval(() => { if (view === 'logs') tickLogs(); }, 1000);
    setInterval(() => { if (view === 'db' && dbLive && dbCurrent) loadTable(dbCurrent.db, dbCurrent.table); }, 1500);
    setInterval(recTick, 1500);
    loadDevice();
    recTick();
    const initialTab = (location.hash || '').slice(1);
    showView(['network', 'prefs', 'db', 'logs'].includes(initialTab) ? initialTab : 'network');
  </script>
</body>
</html>
