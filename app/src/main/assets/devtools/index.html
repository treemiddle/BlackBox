<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlackBox</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0b0d10; color: #e6e6e6; }
    header { padding: 12px 16px; background: #14181d; border-bottom: 1px solid #232a31; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #1c2228; vertical-align: top; }
    th { color: #8b95a1; font-weight: 600; }
    tbody tr.row:hover { background: #14181d; cursor: pointer; }
    .method { color: #7bd88f; font-weight: 600; }
    .ok { color: #7bd88f; }
    .warn { color: #ffd166; }
    .err { color: #ff6b6b; }
    .url { color: #cfd6dd; word-break: break-all; }
    .label { color: #8b95a1; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 0; padding: 12px; background: #0f1317; border-radius: 6px; max-height: 320px; overflow: auto; color: #b9c2cc; }
  </style>
</head>
<body>
  <header><strong>BlackBox</strong> &middot; network &middot; <span id="count">0</span> requests &middot; auto-refresh 1s</header>
  <table>
    <thead>
      <tr><th>#</th><th>method</th><th>code</th><th>ms</th><th>url</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    const open = new Set();
    const MAX = 8000;

    function codeClass(code) {
      if (code >= 500) return 'err';
      if (code >= 400) return 'warn';
      return 'ok';
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function pretty(body) {
      if (!body) return '';
      try {
        return JSON.stringify(JSON.parse(body), null, 2);
      } catch (e) {
        return body;
      }
    }

    function detailHtml(e) {
      let html = '';
      if (e.requestBody) {
        html += '<div class="label">request body</div><pre>' + escapeHtml(pretty(e.requestBody).slice(0, MAX)) + '</pre>';
      }
      html += '<div class="label">response body</div><pre>' + escapeHtml(pretty(e.responseBody).slice(0, MAX)) + '</pre>';
      return html;
    }

    async function tick() {
      let data;
      try {
        const res = await fetch('/api/network');
        data = await res.json();
      } catch (e) {
        return;
      }
      document.getElementById('count').textContent = data.length;
      const rows = document.getElementById('rows');
      rows.innerHTML = '';
      for (const e of data) {
        const row = document.createElement('tr');
        row.className = 'row';
        row.innerHTML =
          '<td>' + e.id + '</td>' +
          '<td class="method">' + e.method + '</td>' +
          '<td class="' + codeClass(e.code) + '">' + e.code + '</td>' +
          '<td>' + e.durationMs + '</td>' +
          '<td class="url">' + escapeHtml(e.url) + '</td>';

        const detail = document.createElement('tr');
        detail.style.display = open.has(e.id) ? '' : 'none';
        detail.innerHTML = '<td colspan="5">' + detailHtml(e) + '</td>';

        row.onclick = () => {
          if (open.has(e.id)) open.delete(e.id); else open.add(e.id);
          detail.style.display = open.has(e.id) ? '' : 'none';
        };

        rows.appendChild(row);
        rows.appendChild(detail);
      }
    }

    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
