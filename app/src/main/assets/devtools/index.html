<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlackBox</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0b0d10; color: #e6e6e6; }
    header { padding: 10px 16px; background: #14181d; border-bottom: 1px solid #232a31; font-size: 14px; display: flex; align-items: center; gap: 16px; }
    .tabs { display: flex; gap: 4px; }
    .tab { padding: 4px 12px; border-radius: 6px; cursor: pointer; color: #8b95a1; }
    .tab.active { background: #222a31; color: #e6e6e6; }
    .muted { color: #8b95a1; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #1c2228; vertical-align: top; }
    th { color: #8b95a1; font-weight: 600; }
    tbody tr.row:hover { background: #14181d; cursor: pointer; }
    .method { color: #7bd88f; font-weight: 600; }
    .ok { color: #7bd88f; } .warn { color: #ffd166; } .err { color: #ff6b6b; }
    .url { color: #cfd6dd; word-break: break-all; }
    .label { color: #8b95a1; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 0; padding: 12px; background: #0f1317; border-radius: 6px; max-height: 320px; overflow: auto; color: #b9c2cc; }
    .pfile { margin: 16px 12px 4px; color: #7bd88f; font-weight: 600; font-size: 13px; }
    .type { color: #8b95a1; }
    .bar { padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    input.pv { background: #0f1317; border: 1px solid #232a31; color: #e6e6e6; border-radius: 4px; padding: 3px 6px; width: 100%; box-sizing: border-box; font-family: inherit; font-size: 13px; }
    button { background: #222a31; border: 1px solid #2b343d; color: #e6e6e6; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 12px; }
    button:hover { background: #2b343d; }
  </style>
</head>
<body>
  <header>
    <strong>BlackBox</strong>
    <div class="tabs">
      <div class="tab active" id="tab-btn-network" onclick="showTab('network')">network</div>
      <div class="tab" id="tab-btn-prefs" onclick="showTab('prefs')">prefs</div>
      <div class="tab" id="tab-btn-db" onclick="showTab('db')">db</div>
    </div>
    <span class="muted" id="meta"></span>
  </header>

  <div id="view-network">
    <table>
      <thead><tr><th>#</th><th>method</th><th>code</th><th>ms</th><th>url</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="view-prefs" style="display:none"></div>
  <div id="view-db" style="display:none"></div>

  <script>
    const open = new Set();
    const MAX = 8000;
    let tab = 'network';

    function showTab(t) {
      tab = t;
      for (const v of ['network', 'prefs', 'db']) {
        document.getElementById('view-' + v).style.display = v === t ? '' : 'none';
        document.getElementById('tab-btn-' + v).className = 'tab' + (v === t ? ' active' : '');
      }
      if (t === 'network') tickNetwork();
      else if (t === 'prefs') tickPrefs();
      else tickDb();
    }

    function codeClass(code) { return code >= 500 ? 'err' : code >= 400 ? 'warn' : 'ok'; }
    function escapeHtml(s) { return (s == null ? '' : String(s)).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function escapeAttr(s) { return escapeHtml(s).replace(/"/g, '&quot;'); }
    function pretty(body) { if (!body) return ''; try { return JSON.stringify(JSON.parse(body), null, 2); } catch (e) { return body; } }

    function detailHtml(e) {
      let html = '';
      if (e.requestBody) html += '<div class="label">request body</div><pre>' + escapeHtml(pretty(e.requestBody).slice(0, MAX)) + '</pre>';
      html += '<div class="label">response body</div><pre>' + escapeHtml(pretty(e.responseBody).slice(0, MAX)) + '</pre>';
      return html;
    }

    async function tickNetwork() {
      let data;
      try { data = await (await fetch('/api/network')).json(); } catch (e) { return; }
      document.getElementById('meta').textContent = data.length + ' requests · auto-refresh 1s';
      const rows = document.getElementById('rows');
      rows.innerHTML = '';
      for (const e of data) {
        const row = document.createElement('tr');
        row.className = 'row';
        row.innerHTML = '<td>' + e.id + '</td><td class="method">' + e.method + '</td><td class="' + codeClass(e.code) + '">' + e.code + '</td><td>' + e.durationMs + '</td><td class="url">' + escapeHtml(e.url) + '</td>';
        const detail = document.createElement('tr');
        detail.style.display = open.has(e.id) ? '' : 'none';
        detail.innerHTML = '<td colspan="5">' + detailHtml(e) + '</td>';
        row.onclick = () => { if (open.has(e.id)) open.delete(e.id); else open.add(e.id); detail.style.display = open.has(e.id) ? '' : 'none'; };
        rows.appendChild(row); rows.appendChild(detail);
      }
    }

    async function tickPrefs() {
      let data;
      try { data = await (await fetch('/api/prefs')).json(); } catch (e) { return; }
      const total = data.reduce((n, f) => n + f.entries.length, 0);
      document.getElementById('meta').textContent = data.length + ' files · ' + total + ' keys · edit & save';
      let html = '<div class="bar"><button onclick="tickPrefs()">↻ refresh</button></div>';
      for (const f of data) {
        html += '<div class="pfile">' + escapeHtml(f.file) + '.xml</div>';
        html += '<table><thead><tr><th>key</th><th>value</th><th>type</th><th></th></tr></thead><tbody>';
        for (const e of f.entries) {
          html += '<tr>' +
            '<td>' + escapeHtml(e.key) + '</td>' +
            '<td><input class="pv" data-file="' + escapeAttr(f.file) + '" data-key="' + escapeAttr(e.key) + '" data-type="' + escapeAttr(e.type) + '" value="' + escapeAttr(e.value) + '"></td>' +
            '<td class="type">' + escapeHtml(e.type) + '</td>' +
            '<td style="white-space:nowrap"><button onclick="savePref(this)">save</button> <button onclick="delPref(this)">del</button></td>' +
            '</tr>';
        }
        html += '</tbody></table>';
      }
      document.getElementById('view-prefs').innerHTML = html;
    }

    async function tickDb() {
      let data;
      try { data = await (await fetch('/api/db')).json(); } catch (e) { return; }
      document.getElementById('meta').textContent = data.length + ' databases · click a table';
      let html = '<div class="bar"><button onclick="tickDb()">↻ refresh</button></div>';
      for (const d of data) {
        html += '<div class="pfile">' + escapeHtml(d.db) + '</div><div class="bar">';
        if (!d.tables.length) html += '<span class="muted">(no tables)</span>';
        for (const t of d.tables) {
          html += '<button class="tbtn" data-db="' + escapeAttr(d.db) + '" data-table="' + escapeAttr(t) + '">' + escapeHtml(t) + '</button>';
        }
        html += '</div>';
      }
      html += '<div id="db-rows"></div>';
      const root = document.getElementById('view-db');
      root.innerHTML = html;
      root.querySelectorAll('.tbtn').forEach(b => { b.onclick = () => loadTable(b.dataset.db, b.dataset.table); });
    }

    async function loadTable(db, table) {
      let data;
      try { data = await (await fetch('/api/db/table?db=' + encodeURIComponent(db) + '&table=' + encodeURIComponent(table))).json(); } catch (e) { return; }
      const el = document.getElementById('db-rows');
      if (data.error) { el.innerHTML = '<div class="bar err">' + escapeHtml(data.error) + '</div>'; return; }
      let html = '<div class="pfile">' + escapeHtml(table) + ' · ' + data.count + ' rows</div><table><thead><tr>';
      for (const col of data.columns) html += '<th>' + escapeHtml(col) + '</th>';
      html += '</tr></thead><tbody>';
      for (const row of data.rows) {
        html += '<tr>';
        for (const cell of row) html += '<td>' + escapeHtml(cell) + '</td>';
        html += '</tr>';
      }
      html += '</tbody></table>';
      el.innerHTML = html;
    }

    async function post(url, payload) {
      const res = await fetch(url, { method: 'POST', body: JSON.stringify(payload) });
      return res.json();
    }

    async function savePref(btn) {
      const i = btn.closest('tr').querySelector('input.pv');
      const r = await post('/api/prefs/edit', { file: i.dataset.file, key: i.dataset.key, type: i.dataset.type, value: i.value });
      if (!r.ok) { alert('edit failed: ' + (r.error || '')); return; }
      tickPrefs();
    }

    async function delPref(btn) {
      const i = btn.closest('tr').querySelector('input.pv');
      if (!confirm('delete ' + i.dataset.key + '?')) return;
      const r = await post('/api/prefs/delete', { file: i.dataset.file, key: i.dataset.key });
      if (!r.ok) { alert('delete failed: ' + (r.error || '')); return; }
      tickPrefs();
    }

    async function tick() { if (tab === 'network') await tickNetwork(); }
    setInterval(tick, 1000);
    tickNetwork();
  </script>
</body>
</html>
