<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BlackBox</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; background: #0b0d10; color: #e6e6e6; }
    header { padding: 10px 16px; background: #14181d; border-bottom: 1px solid #232a31; font-size: 14px; display: flex; align-items: center; gap: 16px; }
    .tabs { display: flex; gap: 4px; }
    .tab { padding: 4px 12px; border-radius: 6px; cursor: pointer; color: #8b95a1; }
    .tab.active { background: #222a31; color: #e6e6e6; }
    .muted { color: #8b95a1; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #1c2228; vertical-align: top; }
    th { color: #8b95a1; font-weight: 600; }
    tbody tr.row:hover { background: #14181d; cursor: pointer; }
    .method { color: #7bd88f; font-weight: 600; }
    .ok { color: #7bd88f; } .warn { color: #ffd166; } .err { color: #ff6b6b; }
    .url { color: #cfd6dd; word-break: break-all; }
    .label { color: #8b95a1; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 4px; }
    pre { white-space: pre-wrap; word-break: break-all; margin: 0; padding: 12px; background: #0f1317; border-radius: 6px; max-height: 320px; overflow: auto; color: #b9c2cc; }
    .pfile { margin: 16px 12px 4px; color: #7bd88f; font-weight: 600; font-size: 13px; }
    .type { color: #8b95a1; }
  </style>
</head>
<body>
  <header>
    <strong>BlackBox</strong>
    <div class="tabs">
      <div class="tab active" id="tab-btn-network" onclick="showTab('network')">network</div>
      <div class="tab" id="tab-btn-prefs" onclick="showTab('prefs')">prefs</div>
    </div>
    <span class="muted" id="meta"></span>
  </header>

  <div id="view-network">
    <table>
      <thead><tr><th>#</th><th>method</th><th>code</th><th>ms</th><th>url</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="view-prefs" style="display:none"></div>

  <script>
    const open = new Set();
    const MAX = 8000;
    let tab = 'network';

    function showTab(t) {
      tab = t;
      document.getElementById('view-network').style.display = t === 'network' ? '' : 'none';
      document.getElementById('view-prefs').style.display = t === 'prefs' ? '' : 'none';
      document.getElementById('tab-btn-network').className = 'tab' + (t === 'network' ? ' active' : '');
      document.getElementById('tab-btn-prefs').className = 'tab' + (t === 'prefs' ? ' active' : '');
      tick();
    }

    function codeClass(code) { return code >= 500 ? 'err' : code >= 400 ? 'warn' : 'ok'; }
    function escapeHtml(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
    function pretty(body) { if (!body) return ''; try { return JSON.stringify(JSON.parse(body), null, 2); } catch (e) { return body; } }

    function detailHtml(e) {
      let html = '';
      if (e.requestBody) html += '<div class="label">request body</div><pre>' + escapeHtml(pretty(e.requestBody).slice(0, MAX)) + '</pre>';
      html += '<div class="label">response body</div><pre>' + escapeHtml(pretty(e.responseBody).slice(0, MAX)) + '</pre>';
      return html;
    }

    async function tickNetwork() {
      let data;
      try { data = await (await fetch('/api/network')).json(); } catch (e) { return; }
      document.getElementById('meta').textContent = data.length + ' requests · auto-refresh 1s';
      const rows = document.getElementById('rows');
      rows.innerHTML = '';
      for (const e of data) {
        const row = document.createElement('tr');
        row.className = 'row';
        row.innerHTML = '<td>' + e.id + '</td><td class="method">' + e.method + '</td><td class="' + codeClass(e.code) + '">' + e.code + '</td><td>' + e.durationMs + '</td><td class="url">' + escapeHtml(e.url) + '</td>';
        const detail = document.createElement('tr');
        detail.style.display = open.has(e.id) ? '' : 'none';
        detail.innerHTML = '<td colspan="5">' + detailHtml(e) + '</td>';
        row.onclick = () => { if (open.has(e.id)) open.delete(e.id); else open.add(e.id); detail.style.display = open.has(e.id) ? '' : 'none'; };
        rows.appendChild(row); rows.appendChild(detail);
      }
    }

    async function tickPrefs() {
      let data;
      try { data = await (await fetch('/api/prefs')).json(); } catch (e) { return; }
      const total = data.reduce((n, f) => n + f.entries.length, 0);
      document.getElementById('meta').textContent = data.length + ' files · ' + total + ' keys · auto-refresh 1s';
      const root = document.getElementById('view-prefs');
      root.innerHTML = '';
      for (const f of data) {
        const title = document.createElement('div');
        title.className = 'pfile';
        title.textContent = f.file + '.xml';
        root.appendChild(title);
        const table = document.createElement('table');
        let body = '<thead><tr><th>key</th><th>value</th><th>type</th></tr></thead><tbody>';
        for (const e of f.entries) {
          body += '<tr><td>' + escapeHtml(e.key) + '</td><td>' + escapeHtml(e.value) + '</td><td class="type">' + escapeHtml(e.type) + '</td></tr>';
        }
        body += '</tbody>';
        table.innerHTML = body;
        root.appendChild(table);
      }
    }

    async function tick() {
      if (tab === 'network') await tickNetwork(); else await tickPrefs();
    }

    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
